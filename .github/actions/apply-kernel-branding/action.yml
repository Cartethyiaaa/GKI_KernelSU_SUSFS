name: 'Apply Kernel Branding & Timestamp'
description: 'Apply a custom kernel name (build-time based) to the kernel version string'
inputs:
  variant:
    description: 'Variant of kernel to apply branding to'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.12)'
    required: true
  android_version:
    description: 'Android version (e.g., android12)'
    required: true
  version:
    description: 'Combined version (e.g., android12-5.10)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  kernel_name_tag:
    description: 'Custom kernel name tag to brand the build with (e.g. Mahirooo-20260806-1530). Falls back to "Custom-<timestamp>" if empty.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Apply Kernel Name Branding
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        VERSION="${{ inputs.version }}"
        ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
        KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)

        TAG="${{ inputs.kernel_name_tag }}"
        if [ -z "$TAG" ]; then
          TAG="Custom-$(date -u +%Y%m%d-%H%M)"
        fi

        if [[ "$VERSION" == "android15-6.6" || "$VERSION" == "android16-6.12" ]]; then
          KERNEL_STRING="$KERNEL_PART.${{ inputs.sublevel }}-$ANDROID_PART"
          sed -i '$d' scripts/setlocalversion && echo "echo \"$KERNEL_STRING-$TAG\"" >> scripts/setlocalversion
        else
          sed -i '$d' scripts/setlocalversion && echo "echo \"-$ANDROID_PART-$TAG\"" >> scripts/setlocalversion
        fi
        chmod +x scripts/setlocalversion

        echo "Kernel branding tag: $TAG"
