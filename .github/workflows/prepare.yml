name: Prepare and Build

on:
  workflow_call:
    inputs:
      config_key:
        description: "Key into .github/config/custom-sources.json (e.g. '5.10' or '6.12')"
        required: true
        type: string
      feature_set:
        description: "Feature Set"
        required: false
        type: string
      ksu_branch:
        description: "KernelSU branch or commit (empty = latest dev)"
        required: false
        type: string
        default: ""
      susfs_commit:
        description: "SUSFS commit hash (empty = latest on auto-derived branch)"
        required: false
        type: string
        default: ""
      kernel_name:
        description: "Custom kernel name (empty = auto, from build time)"
        required: false
        type: string
        default: ""

jobs:
  resolve-source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      android_version: ${{ steps.resolve.outputs.android_version }}
      kernel_version: ${{ steps.resolve.outputs.kernel_version }}
      sublevel: ${{ steps.resolve.outputs.sublevel }}
      os_patch_level: ${{ steps.resolve.outputs.os_patch_level }}
      custom_repo: ${{ steps.resolve.outputs.custom_repo }}
      custom_branch: ${{ steps.resolve.outputs.custom_branch }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Resolve Custom Kernel Source
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_FILE=".github/config/custom-sources.json"
          KEY="${{ inputs.config_key }}"

          TARGET=$(jq -c --arg key "$KEY" '.targets[$key]' "$CONFIG_FILE")
          if [ "$TARGET" = "null" ] || [ -z "$TARGET" ]; then
            echo "ERROR: unknown config_key '$KEY' (expected one of: $(jq -r '.targets | keys | join(", ")' "$CONFIG_FILE"))" >&2
            exit 1
          fi

          ANDROID_VERSION=$(echo "$TARGET" | jq -r '.android_version')
          KERNEL_VERSION=$(echo "$TARGET" | jq -r '.kernel_version')
          SUBLEVEL=$(echo "$TARGET" | jq -r '.manifest_sublevel')
          OS_PATCH_LEVEL=$(echo "$TARGET" | jq -r '.manifest_os_patch_level')
          CUSTOM_REPO=$(echo "$TARGET" | jq -r '.repo')
          CUSTOM_BRANCH=$(echo "$TARGET" | jq -r '.branch')
          VERSION="${ANDROID_VERSION}-${KERNEL_VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "android_version=$ANDROID_VERSION" >> "$GITHUB_OUTPUT"
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          echo "sublevel=$SUBLEVEL" >> "$GITHUB_OUTPUT"
          echo "os_patch_level=$OS_PATCH_LEVEL" >> "$GITHUB_OUTPUT"
          echo "custom_repo=$CUSTOM_REPO" >> "$GITHUB_OUTPUT"
          echo "custom_branch=$CUSTOM_BRANCH" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-source
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.resolve-source.outputs.version }}
      android_version: ${{ needs.resolve-source.outputs.android_version }}
      kernel_version: ${{ needs.resolve-source.outputs.kernel_version }}
      sublevel: ${{ needs.resolve-source.outputs.sublevel }}
      os_patch_level: ${{ needs.resolve-source.outputs.os_patch_level }}
      variant: "Normal"
      feature_set: ${{ inputs.feature_set }}
      ksu_branch: ${{ inputs.ksu_branch }}
      susfs_commit: ${{ inputs.susfs_commit }}
      custom_repo: ${{ needs.resolve-source.outputs.custom_repo }}
      custom_branch: ${{ needs.resolve-source.outputs.custom_branch }}
      kernel_name: ${{ inputs.kernel_name }}
    secrets: inherit
