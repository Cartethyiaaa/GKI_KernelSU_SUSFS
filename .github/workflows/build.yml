name: Build GKI android16-6.12

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - KSUN+SUSFS+BBG+NET+DS
          - KSUN+SUSFS+BBG
          - KSUN+SUSFS+NET
          - KSUN+SUSFS+DS
          - KSUN+SUSFS
          - KSUN
          - FULL
          - NONE
        default: FULL
      ksu_branch:
        description: "KernelSU branch or commit (empty = dev-susfs tip)"
        type: string
        required: false
        default: ""
      susfs_commit:
        description: "SUSFS commit (empty = latest gki-android16-6.12 tip)"
        type: string
        required: false
        default: ""
      kernel_name:
        description: "Custom kernel name (empty = Mahirooo)"
        type: string
        required: false
        default: ""

jobs:
  build:
    name: "android16-6.12"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FEATURE_SET: ${{ inputs.feature_set || 'FULL' }}
      KSU_BRANCH: ${{ inputs.ksu_branch }}
      SUSFS_COMMIT: ${{ inputs.susfs_commit }}
      KERNEL_NAME: ${{ inputs.kernel_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup swap (for LTO)
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 16

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ccache-android16-6.12-${{ github.run_id }}
          restore-keys: |
            ccache-android16-6.12-

      - name: Cache bazel
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel
          key: bazel-android16-6.12-${{ github.run_id }}
          restore-keys: |
            bazel-android16-6.12-

      - name: Run build.sh
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: android16-6.12-AnyKernel3
          path: gki-build/out/*.zip
          if-no-files-found: error
          compression-level: 9
