name: Build Kinosaki Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      targets:
        description: "Which kernel target(s) to build"
        type: choice
        options:
          - "Both (6.12 + cass)"
          - "6.12"
          - "cass"
        default: "Both (6.12 + cass)"
      ksu_branch:
        description: "KernelSU-Next branch or commit (empty = latest next tip)"
        type: string
        required: false
        default: ""
      kernel_name:
        description: "Custom branding tag (empty = auto BORE/CASS)"
        type: string
        required: false
        default: ""

jobs:
  resolve-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set.outputs.targets }}
    steps:
      - id: set
        run: |
          case "${{ inputs.targets || 'Both (6.12 + cass)' }}" in
            "6.12") echo 'targets=["6.12"]' >> "$GITHUB_OUTPUT" ;;
            "cass") echo 'targets=["cass"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'targets=["6.12","cass"]' >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: "Build (${{ matrix.target }})"
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve-matrix.outputs.targets) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ matrix.target }}-

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Build Kinosaki Kernel (${{ matrix.target }})
        run: |
          ARGS=(--target "${{ matrix.target }}")
          [[ -n "${{ inputs.ksu_branch }}" ]] && ARGS+=(--ksu-branch "${{ inputs.ksu_branch }}")
          [[ -n "${{ inputs.kernel_name }}" ]] && ARGS+=(--kernel-name "${{ inputs.kernel_name }}")

          ./build.sh "${ARGS[@]}"

      - name: Upload patch rejects (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kinosaki-${{ matrix.target }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Kinosaki-${{ matrix.target }}-AnyKernel3
          path: out/*.zip
          if-no-files-found: error
          compression-level: 9

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_type == 'Pre-Release' || inputs.release_type == 'Release') }}
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate New Tag
        id: tag
        run: |
          mapfile -t RELEASE_TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^r[0-9]+$' || true)
          LATEST_REV=0
          for TAG in "${RELEASE_TAGS[@]}"; do
            REV="${TAG#r}"
            [[ "$REV" =~ ^[0-9]+$ && "$REV" -gt "$LATEST_REV" ]] && LATEST_REV="$REV"
          done
          NEW_TAG="r$((LATEST_REV + 1))"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Download AnyKernel3 Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 'Kinosaki-*-AnyKernel3'
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: "Kinosaki Kernel ${{ steps.tag.outputs.new_tag }}"
          body: |
            ## Kinosaki Kernel — ${{ steps.tag.outputs.new_tag }}

            - KernelSU-Next: `${{ inputs.ksu_branch || 'next (official tip)' }}`
            - Targets built: ${{ inputs.targets || 'Both (6.12 + cass)' }}
          draft: false
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: release-assets/*.zip
